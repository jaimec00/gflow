name: Maturin Build

on:
    push:
        tags:
            - "*"
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    linux:
        runs-on: ${{ matrix.platform.runner }}
        timeout-minutes: 60
        strategy:
            matrix:
                platform:
                    - runner: ubuntu-22.04
                      target: x86_64
                    - runner: ubuntu-22.04
                      target: aarch64
        steps:
            - uses: actions/checkout@v7
            - name: Install Bun
              uses: oven-sh/setup-bun@v2
            - name: Install web dependencies
              working-directory: web
              run: bun install --frozen-lockfile
            - name: Build web UI
              run: bun run --cwd web build
            - name: Build wheels
              uses: PyO3/maturin-action@v1
              with:
                  target: ${{ matrix.platform.target }}
                  args: --profile minimal-size --out dist
                  sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
                  manylinux: auto
              env:
                  CFLAGS: "-Wno-error"
                  CFLAGS_aarch64_unknown_linux_gnu: "-Wno-error -D__ARM_ARCH=8"
            - name: Upload wheels
              uses: actions/upload-artifact@v7
              with:
                  name: wheels-linux-${{ matrix.platform.target }}
                  path: dist

    macos:
        runs-on: ${{ matrix.platform.runner }}
        timeout-minutes: 60
        strategy:
            matrix:
                platform:
                    - runner: macos-14
                      target: aarch64-apple-darwin
                    - runner: macos-15
                      target: x86_64-apple-darwin
        steps:
            - uses: actions/checkout@v7
            - name: Install Bun
              uses: oven-sh/setup-bun@v2
            - name: Install web dependencies
              working-directory: web
              run: bun install --frozen-lockfile
            - name: Build web UI
              run: bun run --cwd web build
            - name: Build wheels
              uses: PyO3/maturin-action@v1
              with:
                  target: ${{ matrix.platform.target }}
                  args: --profile minimal-size --out dist
                  sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
            - name: Upload wheels
              uses: actions/upload-artifact@v7
              with:
                  name: wheels-macos-${{ matrix.platform.runner }}
                  path: dist

    sdist:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
            - name: Install Bun
              uses: oven-sh/setup-bun@v2
            - name: Install web dependencies
              working-directory: web
              run: bun install --frozen-lockfile
            - name: Build web UI
              run: bun run --cwd web build
            - name: Build sdist
              uses: PyO3/maturin-action@v1
              with:
                  command: sdist
                  args: --out dist
            - name: Upload sdist
              uses: actions/upload-artifact@v7
              with:
                  name: wheels-sdist
                  path: dist

    release:
        name: Release
        runs-on: ubuntu-latest
        timeout-minutes: 20
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        needs: [linux, sdist]
        permissions:
            # Used to upload release artifacts
            contents: write
        steps:
            - uses: actions/download-artifact@v8
            - name: Attach wheels to the GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
                      || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "Release $tag" --notes "wheels built by ci"
                  gh release upload "$tag" wheels-*/* --repo "$GITHUB_REPOSITORY" --clobber
